name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production dependencies must have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=low
      - name: RepoLens analyses itself (no leaked credentials, health at least 60)
        run: node bin/repolens.mjs . --fail-on secret --min-score 60
